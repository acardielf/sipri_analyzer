name: CI

on:
  push:
    branches:
      - main
    # Sin paths-ignore: docs/ ya no vive en main, el sitio se publica en la rama
    # gh-pages. Un push a gh-pages no reentra aquí porque este disparador solo
    # escucha main.
  schedule:
    - cron: "0 16 * 1-6,9-12 *" # todos los días de septiembre a junio (excluye julio y agosto) a las 16:00 UTC
  workflow_dispatch:
    # Sin inputs se comporta exactamente igual que el cron: procesa las últimas
    # convocatorias y regenera el sitio. Rellenando `convocatoria` se borra esa
    # convocatoria del artefacto heredado —adjudicaciones, plazas, la propia
    # convocatoria y sus PDFs— antes de procesar, y el paso de siempre
    # (`sipri:last --back 2`) la vuelve a descargar y extraer desde cero.
    #
    # Es la única forma de corregir datos malos: sipri:ext omite las plazas ya
    # existentes (hash SHA-256) y sipri:adj sale sin hacer nada si la
    # convocatoria ya tiene adjudicaciones.
    inputs:
      convocatoria:
        description: 'Nº de convocatoria a borrar y reprocesar, una de las 2 últimas (vacío = ejecución normal)'
        required: false
        type: string
  workflow_call:


# El grupo va por ref, no por run_id: con run_id cada ejecución caía en un grupo
# distinto y la exclusión no llegaba a aplicarse nunca. Dos runs sobre main —el
# cron y un push, por ejemplo— heredaban el mismo artefacto, regeneraban el mismo
# sitio y peleaban por el push de docs/; así murió el run 34121857427 con
# «! [rejected] main -> main (fetch first)».
#
# cancel-in-progress: false a propósito. Cancelar a mitad de `sipri:last` deja
# los PDFs ya descargados sin subir artefacto y el trabajo se pierde, así que
# aquí interesa encolar, no cancelar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-last-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:

      # Antes que nada: un input mal escrito no debe gastar un build entero.
      # Que esté entre las dos últimas convocatorias se comprueba más abajo,
      # cuando ya se ha heredado la BD.
      - name: Validar el input de borrado
        if: ${{ inputs.convocatoria != '' }}
        env:
          CONV: ${{ inputs.convocatoria }}
        run: |
          case "$CONV" in
            ''|*[!0-9]*) echo "::error::'$CONV' no es un número de convocatoria válido"; exit 1 ;;
          esac
          echo "Se borrará y reprocesará la convocatoria $CONV."

      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Download artifact from ci.yml
        uses: actions/github-script@v7.0.1
        continue-on-error: true
        with:
          script: |
            try {
              const workflowFileName = "ci.yml";
              const artifactName = "sipri-analyzer-files";
              const fs = require("fs");

              async function downloadArtifact(workflowFileName) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowFileName,
                  status: "success",
                  per_page: 1
                });

                if (runs.data.workflow_runs.length === 0) {
                  core.warning(`⚠️ No se encontró ejecución previa para ${workflowFileName}`);
                  return false;
                }

                const run_id = runs.data.workflow_runs[0].id;

                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });

                const artifact = artifacts.data.artifacts.find(a => a.name === artifactName);
                if (!artifact) {
                  core.warning(`⚠️ No se encontró el artefacto ${artifactName} en ${workflowFileName}`);
                  return false;
                }

                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: "zip"
                });

                fs.writeFileSync(`${artifactName}-${workflowFileName}.zip`, Buffer.from(download.data));
                return true;
              }

              await downloadArtifact("ci.yml");
            } catch (e) {
              core.warning(`⚠️ Error al descargar artefacto ci.yml: ${e.message}`);
            }

      - name: Unzip ci artifact if exists
        continue-on-error: true
        run: |
          if [ -f sipri-analyzer-files-ci.yml.zip ]; then
            unzip -o sipri-analyzer-files-ci.yml.zip -d .
          fi

      - name: Install PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          # gd genera las imágenes de previsualización (sipri:og-images)
          php-version: '8.5'
          extensions: mbstring, intl, pdo, pdo_sqlite, xml, curl, zip, gd
          tools: composer:v2
          coverage: none

      - name: Make envfile
        run: |
          cat > .env << 'EOF'
          APP_ENV=prod
          DATABASE_URL=sqlite:///%kernel.project_dir%/var/data_%kernel.environment%.db
          EOF

      - name: Cache Vendor dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-vendor-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: bin/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bin/requirements.txt

      - name: Install Java (for tabula-py)
        run: sudo apt-get update && sudo apt-get install -y default-jre

      - name: Prepare Symfony dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php bin/console cache:clear


      - name: Prepare Symfony DB
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Check existing records
        id: bd
        run: |
          set -euo pipefail
          php bin/console dbal:run-sql "SELECT max(cast(id as integer)) FROM convocatoria"
          # Leer el número a pelo en vez de rascar con grep la tabla que pinta
          # dbal:run-sql.
          ULTIMA=$(php -r 'echo (int) (new PDO("sqlite:".$argv[1]))->query($argv[2])->fetchColumn();' -- var/data_prod.db 'SELECT max(cast(id as integer)) FROM convocatoria')
          echo "ultima=$ULTIMA" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Borrado puntual de una convocatoria (solo con workflow_dispatch y el
      # input relleno). Vive dentro de ci.yml a propósito: el artefacto
      # heredado se busca por workflow_id, así que un workflow aparte subiría
      # un sipri-analyzer-files que el CI diario nunca miraría y el arreglo se
      # perdería en la siguiente ejecución.
      # ---------------------------------------------------------------------
      - name: Comprobar que es una de las dos últimas convocatorias
        if: ${{ inputs.convocatoria != '' }}
        env:
          CONV: ${{ inputs.convocatoria }}
          ULTIMA: ${{ steps.bd.outputs.ultima }}
        run: |
          set -euo pipefail
          # Del borrado se sale reprocesando con el `sipri:last --back 2` de
          # siempre, que solo repasa el final de la lista. Una convocatoria más
          # antigua se quedaría borrada y desaparecería del sitio.
          if [ "${ULTIMA:-0}" -le 0 ]; then
            echo "::error::La BD heredada no tiene convocatorias: o no se ha heredado artefacto o viene vacío. No se borra nada."
            exit 1
          fi

          if [ "$CONV" -lt "$(( ULTIMA - 1 ))" ] || [ "$CONV" -gt "$ULTIMA" ]; then
            echo "::error::Solo se pueden borrar las dos últimas convocatorias ($(( ULTIMA - 1 )) y $ULTIMA); has pedido la $CONV."
            exit 1
          fi

      - name: Copia de seguridad de la BD antes de borrar
        if: ${{ inputs.convocatoria != '' }}
        run: cp var/data_prod.db "${{ runner.temp }}/data_prod_backup.db"

      # Nombre distinto de sipri-analyzer-files a propósito: así queda fuera de
      # la cadena que hereda el CI y sirve solo como vuelta atrás manual.
      - name: Subir copia de seguridad de la BD
        if: ${{ inputs.convocatoria != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backup-db-antes-de-borrar-${{ github.run_id }}
          path: ${{ runner.temp }}/data_prod_backup.db
          retention-days: 30

      - name: Eliminar convocatoria, adjudicaciones y ficheros
        id: borrado
        if: ${{ inputs.convocatoria != '' }}
        env:
          CONV: ${{ inputs.convocatoria }}
        run: |
          set -euo pipefail
          echo "== Antes de borrar =="
          php bin/console dbal:run-sql "SELECT count(*) AS plazas FROM plaza WHERE convocatoria_id = $CONV"
          php bin/console dbal:run-sql "SELECT count(*) AS adjudicaciones FROM adjudicacion a JOIN plaza p ON p.id = a.plaza_id WHERE p.convocatoria_id = $CONV"

          # Se guarda para poder decir luego si la Junta ha republicado los
          # anexos o si el reproceso solo ha vuelto a pasar el extractor.
          echo "hash=$(cat pdfs/*/"${CONV}"_plazas.pdf pdfs/*/"${CONV}"_adjudicados.pdf 2>/dev/null | sha256sum | cut -d' ' -f1 || true)" >> "$GITHUB_OUTPUT"

          # Orden obligatorio: adjudicacion.plaza_id es una FK sin ON DELETE
          # CASCADE, así que las adjudicaciones van primero. Además sipri:del
          # trata «adjudicaciones» y «plazas + convocatoria» como modos
          # excluyentes, de ahí las dos invocaciones. --files borra los PDFs y
          # el JSON de tabula.
          php bin/console sipri:del --files --adjudicaciones "$CONV"
          php bin/console sipri:del "$CONV"

          echo "== Después de borrar =="
          php bin/console dbal:run-sql "SELECT count(*) AS plazas FROM plaza WHERE convocatoria_id = $CONV"

          # sipri:get solo descarga lo que no está en disco, así que un fichero
          # superviviente haría que el reproceso releyera el PDF viejo.
          RESTOS=$(ls pdfs/*/"${CONV}"_* 2>/dev/null || true)
          if [ -n "$RESTOS" ]; then
            echo "::error::Quedan ficheros de la convocatoria $CONV en disco:"
            echo "$RESTOS"
            exit 1
          fi

      - name: Huella de los datos antes de procesar
        id: datos_antes
        run: |
          set -euo pipefail
          echo "huella=$(php bin/huella-datos.php var/data_prod.db)" >> "$GITHUB_OUTPUT"

      # Este paso es también el reproceso: como la convocatoria y sus PDFs ya no
      # están, sipri:get los vuelve a descargar y sipri:ext / sipri:adj los
      # extraen desde cero. Por eso el borrado se limita a las dos últimas.
      - name: Run SIPRI Analyzer only last
        run: php bin/console sipri:last --back 2 || true

      # Si el reproceso no ha devuelto los datos, algo ha ido mal (p. ej. SIPRI
      # ha retirado los anexos mientras la Junta prepara una corrección): mejor
      # fallar aquí que subir un artefacto peor que el heredado. Al no llegar a
      # «Upload artifacts», el siguiente run seguirá heredando el anterior.
      - name: Comprobar que el reproceso ha dejado datos
        if: ${{ inputs.convocatoria != '' }}
        env:
          CONV: ${{ inputs.convocatoria }}
          HASH_ANTES: ${{ steps.borrado.outputs.hash }}
        run: |
          set -euo pipefail
          q() { php -r 'echo (int) (new PDO("sqlite:".$argv[1]))->query($argv[2])->fetchColumn();' -- var/data_prod.db "$1"; }

          PLAZAS=$(q "SELECT count(*) FROM plaza WHERE convocatoria_id = $CONV")
          ADJUDICACIONES=$(q "SELECT count(*) FROM adjudicacion a JOIN plaza p ON p.id = a.plaza_id WHERE p.convocatoria_id = $CONV")
          echo "Tras el reproceso -> plazas: $PLAZAS, adjudicaciones: $ADJUDICACIONES"

          if [ "$PLAZAS" -eq 0 ]; then
            echo "::error::La convocatoria $CONV se ha quedado sin plazas: SIPRI no ha servido el anexo o ha fallado la extracción. No se sube artefacto; la BD de antes del borrado está en backup-db-antes-de-borrar-${{ github.run_id }}."
            exit 1
          fi

          if [ "$ADJUDICACIONES" -eq 0 ]; then
            echo "::warning::La convocatoria $CONV ha vuelto sin adjudicaciones. Si el anexo de adjudicados está retirado mientras la Junta lo corrige, entrará en un run posterior."
          fi

          HASH_AHORA=$(cat pdfs/*/"${CONV}"_plazas.pdf pdfs/*/"${CONV}"_adjudicados.pdf 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
          if [ "$HASH_ANTES" = "$HASH_AHORA" ]; then
            echo "::warning::Los PDFs son idénticos a los que ya había: el reproceso solo cambia algo si se ha tocado el código de extracción."
          else
            echo "PDFs distintos de los anteriores: la Junta los ha republicado."
          fi

      # Generar el sitio son ~2,5 min y 8.300 ficheros reescritos. Cuando el cron
      # pasa por SIPRI y no hay convocatoria nueva —38 de los 71 commits
      # automáticos medidos, el 54%— lo único que cambiaba en todo el sitio era
      # la fecha «Datos actualizados a» de docs/index.html, y ese commit bastaba
      # para disparar un despliegue de Pages entero.
      #
      # El atajo se limita al cron a propósito: un push trae código (plantillas,
      # CSS, rutas) que cambia el HTML sin tocar la BD, y un dispatch manual se
      # lanza justamente para ver el sitio regenerado.
      - name: Decidir si hay que regenerar el sitio
        id: sitio
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ steps.datos_antes.outputs.huella }}
        run: |
          set -euo pipefail
          DESPUES=$(php bin/huella-datos.php var/data_prod.db)
          echo "Antes:   $ANTES"
          echo "Después: $DESPUES"

          if [ "$EVENTO" != "schedule" ]; then
            MOTIVO="evento $EVENTO: se regenera siempre"
            REGENERAR=true
          elif [ "$ANTES" != "$DESPUES" ]; then
            MOTIVO="hay datos nuevos"
            REGENERAR=true
          else
            MOTIVO="sin datos nuevos"
            REGENERAR=false
          fi

          echo "regenerar=$REGENERAR" >> "$GITHUB_OUTPUT"

          if [ "$REGENERAR" = true ]; then
            echo "### Sitio regenerado ($MOTIVO)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Sin datos nuevos: se salta generar, minificar y publicar el sitio."
            echo "### Sitio sin cambios ($MOTIVO)" >> "$GITHUB_STEP_SUMMARY"
            echo "SIPRI no ha traído nada nuevo, así que no se regenera el sitio ni se publica." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "antes:   $ANTES" >> "$GITHUB_STEP_SUMMARY"
          echo "después: $DESPUES" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # success() explícito: al poner un `if:` propio se pierde el que los pasos
      # llevan de serie, y sin él esto correría incluso con el job ya fallado.
      - name: Generate static website
        if: ${{ success() && steps.sitio.outputs.regenerar == 'true' }}
        run: |
          php bin/console sipri:og-images
          php bin/console asset-map:compile
          php bin/console -e prod cache:clear
          php bin/console -e prod stenope:build --host=acardielf.github.io --base-url=/sipri_analyzer --scheme=https --no-sitemap ./docs
          rm public/assets/ -rf

      # minify-html (Rust): procesa los ~1,6 GB de HTML en segundos, donde un
      # minificador en JS tardaría minutos. Reduce el peso a algo menos de la
      # mitad, lo que además frena el crecimiento del historial del repositorio.
      # El script es el mismo que se usa en local: bin/minify-docs.sh
      - name: Minify generated HTML
        if: ${{ success() && steps.sitio.outputs.regenerar == 'true' }}
        run: bin/minify-docs.sh ./docs

      # Si la minificación rompiera el <head>, las previsualizaciones al
      # compartir dejarían de funcionar sin que nadie se diera cuenta.
      - name: Verify metadata survived minification
        if: ${{ success() && steps.sitio.outputs.regenerar == 'true' }}
        run: |
          python3 - <<'EOF'
          import glob, sys
          from html.parser import HTMLParser

          class Meta(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = {}
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  clave = d.get('property') or d.get('name')
                  if tag == 'meta' and clave:
                      self.tags[clave] = d.get('content')

          requeridas = ['og:title', 'og:description', 'og:image', 'og:url', 'twitter:card']
          fallos = []

          for ruta in ['docs/index.html'] + sorted(glob.glob('docs/*/*/index.html'))[:40]:
              p = Meta()
              p.feed(open(ruta, encoding='utf-8').read())
              faltan = [t for t in requeridas if not p.tags.get(t)]
              if faltan:
                  fallos.append(f'{ruta}: faltan {", ".join(faltan)}')

          if fallos:
              print('\n'.join(fallos))
              sys.exit(1)

          print('Meta etiquetas Open Graph verificadas.')
          EOF

      # El sitio se publica en una rama aparte, no en main. Con Pages sirviendo
      # desde main:/docs, GitHub desplegaba ante *cualquier* push a main: 23 de
      # los últimos 120 despliegues fueron sobre commits que ni tocaban docs/.
      # Sirviendo desde gh-pages, que solo escribe este paso, se despliega
      # exactamente cuando hay sitio nuevo.
      #
      # La rama se reescribe entera cada vez (commit huérfano + push --force) en
      # lugar de acumular historial: el sitio son ~8.300 ficheros y versionarlo
      # en main es lo que ha llevado el repositorio a 886 MB.
      - name: Publicar el sitio en gh-pages
        id: publicar
        if: ${{ success() && steps.sitio.outputs.regenerar == 'true' }}
        env:
          # PAT antes que GITHUB_TOKEN: un push hecho con GITHUB_TOKEN no
          # dispara automatismos, y es el push a gh-pages el que tiene que
          # despertar el despliegue de Pages.
          TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Repositorio propio y efímero dentro de docs/, que se va con el runner.
          # docs/ está en .gitignore, así que no interfiere con el checkout.
          cd docs

          # Pages pasa el sitio por Jekyll salvo que exista este fichero, y Jekyll
          # se come lo que empiece por _ o por punto.
          touch .nojekyll

          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Actualizar página pública ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

          FICHEROS=$(git ls-files | wc -l)
          echo "Publicados $FICHEROS ficheros en gh-pages ($(du -sh . | cut -f1))."
          echo "Publicados **$FICHEROS ficheros** en \`gh-pages\`." >> "$GITHUB_STEP_SUMMARY"

      # El CI solo lee el último sipri-analyzer-files correcto, así que los 90 días
      # por defecto solo acumulaban gigas (60 artefactos vivos, 8,57 GB medidos).
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sipri-analyzer-files
          retention-days: 7
          path: |
            pdfs/
            var/data_prod.db
