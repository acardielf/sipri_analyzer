name: CI

on:
  push:
    branches:
      - main
    # El propio workflow hace commit de docs/. Si ese commit se empuja con un PAT
    # (secrets.PAT), GitHub sí dispara workflows de nuevo: sin esta exclusión se
    # entraría en bucle.
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: "0 16 * 1-6,9-12 *" # todos los días de septiembre a junio (excluye julio y agosto) a las 16:00 UTC
  workflow_dispatch:
    # Sin inputs se comporta exactamente igual que el cron: procesa las últimas
    # convocatorias y regenera el sitio. Con `convocatoria` se borra esa
    # convocatoria del artefacto heredado y se vuelve a extraer desde cero,
    # que es la única forma de corregir datos malos: sipri:ext omite las plazas
    # ya existentes (hash SHA-256) y sipri:adj sale sin hacer nada si la
    # convocatoria ya tiene adjudicaciones.
    inputs:
      convocatoria:
        description: 'Nº de convocatoria a borrar y reprocesar (vacío = ejecución normal)'
        required: false
        type: string
      redescargar_pdfs:
        description: 'Volver a descargar los PDFs (marcar si el error venía del propio PDF)'
        required: false
        type: boolean
        default: true
  workflow_call:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  get-last-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Download artifact from full-manual.yml
        uses: actions/github-script@v7.0.1
        continue-on-error: true
        with:
          script: |
            try {
              const workflowFileName = "full-manual.yml";
              const artifactName = "sipri-analyzer-files";

              async function downloadArtifact(workflowFileName) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowFileName,
                  status: "success",
                  per_page: 1
                });

                if (runs.data.workflow_runs.length === 0) {
                  core.warning(`⚠️ No se encontró ejecución previa para ${workflowFileName}`);
                  return false;
                }

                const run_id = runs.data.workflow_runs[0].id;

                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });

                const artifact = artifacts.data.artifacts.find(a => a.name === artifactName);
                if (!artifact) {
                  core.warning(`⚠️ No se encontró el artefacto ${artifactName} en ${workflowFileName}`);
                  return false;
                }

                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: "zip"
                });

                const fs = require("fs");
                fs.writeFileSync(`${artifactName}-${workflowFileName}.zip`, Buffer.from(download.data));
                return true;
              }

              await downloadArtifact("full-manual.yml");
            } catch (e) {
              core.warning(`⚠️ Error al descargar artefacto full-manual.yml: ${e.message}`);
            }

      - name: Unzip full-manual artifact if exists
        continue-on-error: true
        run: |
          if [ -f sipri-analyzer-files-full-manual.yml.zip ]; then
            unzip -o sipri-analyzer-files-full-manual.yml.zip -d .
          fi

      - name: Download artifact from ci.yml
        uses: actions/github-script@v7.0.1
        continue-on-error: true
        with:
          script: |
            try {
              const workflowFileName = "ci.yml";
              const artifactName = "sipri-analyzer-files";
              const fs = require("fs");

              async function downloadArtifact(workflowFileName) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowFileName,
                  status: "success",
                  per_page: 1
                });

                if (runs.data.workflow_runs.length === 0) {
                  core.warning(`⚠️ No se encontró ejecución previa para ${workflowFileName}`);
                  return false;
                }

                const run_id = runs.data.workflow_runs[0].id;

                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });

                const artifact = artifacts.data.artifacts.find(a => a.name === artifactName);
                if (!artifact) {
                  core.warning(`⚠️ No se encontró el artefacto ${artifactName} en ${workflowFileName}`);
                  return false;
                }

                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: "zip"
                });

                fs.writeFileSync(`${artifactName}-${workflowFileName}.zip`, Buffer.from(download.data));
                return true;
              }

              await downloadArtifact("ci.yml");
            } catch (e) {
              core.warning(`⚠️ Error al descargar artefacto ci.yml: ${e.message}`);
            }


      - name: Unzip ci artifact if exists (overwrites duplicates)
        continue-on-error: true
        run: |
          if [ -f sipri-analyzer-files-ci.yml.zip ]; then
            unzip -o sipri-analyzer-files-ci.yml.zip -d .
          fi

      - name: Install PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          # gd genera las imágenes de previsualización (sipri:og-images)
          php-version: '8.5'
          extensions: mbstring, intl, pdo, pdo_sqlite, xml, curl, zip, gd
          tools: composer:v2
          coverage: none

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: ./vendor/
          key: sipri_cache

      - name: Make envfile
        run: |
          cat > .env << 'EOF'
          APP_ENV=prod
          DATABASE_URL=sqlite:///%kernel.project_dir%/var/data_%kernel.environment%.db
          EOF

      - name: Cache Vendor dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-vendor-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tabula-py[jpype] pandas

      - name: Install Java (for tabula-py)
        run: sudo apt-get update && sudo apt-get install -y default-jre

      - name: Prepare Symfony dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php bin/console cache:clear


      - name: Prepare Symfony DB
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Check existing records
        run: |
          php bin/console dbal:run-sql "SELECT max(cast(id as integer)) FROM convocatoria"

      # ---------------------------------------------------------------------
      # Reproceso puntual de una convocatoria (solo con workflow_dispatch).
      # Todo esto vive dentro de ci.yml a propósito: el artefacto heredado se
      # busca por workflow_id, así que un workflow aparte subiría un
      # sipri-analyzer-files que el CI diario nunca miraría y el arreglo se
      # perdería en la siguiente ejecución.
      # ---------------------------------------------------------------------
      - name: Copia de seguridad de la BD antes de reprocesar
        if: ${{ inputs.convocatoria != '' }}
        run: |
          if [ ! -f var/data_prod.db ]; then
            echo "::error::No hay var/data_prod.db: no se ha heredado artefacto. Aborta antes de tocar nada."
            exit 1
          fi
          cp var/data_prod.db "${{ runner.temp }}/data_prod_backup.db"

      # Nombre distinto de sipri-analyzer-files a propósito: así queda fuera de
      # la cadena que hereda el CI y sirve solo como vuelta atrás manual.
      - name: Subir copia de seguridad de la BD
        if: ${{ inputs.convocatoria != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backup-db-antes-de-reprocesar-${{ github.run_id }}
          path: ${{ runner.temp }}/data_prod_backup.db
          retention-days: 30

      # Los PDFs se descargan ANTES de borrar nada: la Junta retira los anexos de
      # adjudicados cuando va a republicar una adjudicación corregida, y en ese
      # rato no hay nada que reprocesar. Si se borrase primero, el job se
      # quedaría a medias (sin subir artefacto, pero habiendo gastado el build).
      - name: Descargar PDFs antes de tocar la BD
        if: ${{ inputs.convocatoria != '' }}
        env:
          CONV: ${{ inputs.convocatoria }}
          REDESCARGAR: ${{ inputs.redescargar_pdfs }}
        run: |
          set -euo pipefail
          case "$CONV" in
            ''|*[!0-9]*) echo "::error::'$CONV' no es un número de convocatoria válido"; exit 1 ;;
          esac

          HASH_ANTES=$(cat pdfs/*/"${CONV}"_plazas.pdf pdfs/*/"${CONV}"_adjudicados.pdf 2>/dev/null | sha256sum | cut -d' ' -f1 || true)

          if [ "$REDESCARGAR" = "true" ]; then
            php bin/console sipri:get "$CONV" --force
          else
            php bin/console sipri:get "$CONV"
          fi

          # sipri:get devuelve SUCCESS aunque SIPRI no ofrezca los enlaces, y
          # exige encontrar los dos anexos para descargar cualquiera de ellos:
          # hay que comprobar los ficheros a mano.
          PLAZAS_PDF=$(ls pdfs/*/"${CONV}"_plazas.pdf 2>/dev/null | head -1 || true)
          ADJ_PDF=$(ls pdfs/*/"${CONV}"_adjudicados.pdf 2>/dev/null | head -1 || true)

          if [ -z "$PLAZAS_PDF" ] || [ -z "$ADJ_PDF" ] || [ ! -s "$PLAZAS_PDF" ] || [ ! -s "$ADJ_PDF" ]; then
            echo "::error::SIPRI no está sirviendo los dos anexos de la convocatoria $CONV (suele pasar mientras la Junta prepara una adjudicación corregida). No se ha borrado nada; reintenta cuando vuelvan a estar publicados."
            exit 1
          fi

          HASH_AHORA=$(cat "$PLAZAS_PDF" "$ADJ_PDF" | sha256sum | cut -d' ' -f1)
          if [ "$HASH_ANTES" = "$HASH_AHORA" ]; then
            echo "::warning::Los PDFs son idénticos a los ya procesados. El reproceso solo cambiará algo si se ha tocado el código de extracción."
          else
            echo "PDFs distintos de los anteriores: la Junta los ha republicado."
          fi

      - name: Eliminar convocatoria a reprocesar
        if: ${{ inputs.convocatoria != '' }}
        env:
          CONV: ${{ inputs.convocatoria }}
        run: |
          set -euo pipefail
          echo "== Antes de borrar =="
          php bin/console dbal:run-sql "SELECT count(*) AS plazas FROM plaza WHERE convocatoria_id = $CONV"
          php bin/console dbal:run-sql "SELECT count(*) AS adjudicaciones FROM adjudicacion a JOIN plaza p ON p.id = a.plaza_id WHERE p.convocatoria_id = $CONV"

          # Orden obligatorio: adjudicacion.plaza_id es una FK sin ON DELETE
          # CASCADE, así que las adjudicaciones van primero. Además sipri:del
          # trata «adjudicaciones» y «plazas + convocatoria» como modos
          # excluyentes, de ahí las dos invocaciones. Sin --files: los PDFs que
          # hay en disco son ya los que se van a reprocesar.
          php bin/console sipri:del "$CONV" --adjudicaciones
          php bin/console sipri:del "$CONV"

          echo "== Después de borrar =="
          php bin/console dbal:run-sql "SELECT count(*) AS plazas FROM plaza WHERE convocatoria_id = $CONV"

      # Reproceso explícito en lugar de confiar en sipri:last --back 2, que solo
      # cubre las tres últimas convocatorias: así también se puede arreglar una
      # antigua.
      - name: Reprocesar convocatoria
        if: ${{ inputs.convocatoria != '' }}
        env:
          CONV: ${{ inputs.convocatoria }}
        run: |
          set -euo pipefail
          php bin/console sipri:ext "$CONV"
          php bin/console sipri:adj "$CONV"

          echo "== Resultado del reproceso =="
          php bin/console dbal:run-sql "SELECT count(*) AS plazas FROM plaza WHERE convocatoria_id = $CONV"
          php bin/console dbal:run-sql "SELECT count(*) AS adjudicaciones FROM adjudicacion a JOIN plaza p ON p.id = a.plaza_id WHERE p.convocatoria_id = $CONV"

      # Si el reproceso ha dejado la convocatoria vacía, algo ha ido mal: mejor
      # fallar aquí que subir un artefacto peor que el heredado. Al no llegar al
      # paso de subida, el siguiente run seguirá heredando el artefacto anterior.
      - name: Comprobar que el reproceso ha dejado datos
        if: ${{ inputs.convocatoria != '' }}
        env:
          CONV: ${{ inputs.convocatoria }}
        run: |
          set -euo pipefail
          PLAZAS=$(php bin/console dbal:run-sql "SELECT count(*) FROM plaza WHERE convocatoria_id = $CONV" | grep -oE '[0-9]+' | tail -1)
          echo "Plazas tras el reproceso: $PLAZAS"
          if [ "${PLAZAS:-0}" -eq 0 ]; then
            echo "::error::La convocatoria $CONV se ha quedado sin plazas. No se sube artefacto."
            exit 1
          fi

      - name: Run SIPRI Analyzer only last
        run: php bin/console sipri:last --back 2 || true

      - name: Generate static website
        #        if: ${{ success() && steps.sipri.outcome == 'success' }}
        run: |
          php bin/console sipri:og-images
          php bin/console asset-map:compile
          php bin/console -e prod cache:clear
          php bin/console -e prod stenope:build --host=acardielf.github.io --base-url=/sipri_analyzer --scheme=https --no-sitemap ./docs
          rm public/assets/ -rf

      # minify-html (Rust): procesa los ~1,6 GB de HTML en segundos, donde un
      # minificador en JS tardaría minutos. Reduce el peso a algo menos de la
      # mitad, lo que además frena el crecimiento del historial del repositorio.
      # El script es el mismo que se usa en local: bin/minify-docs.sh
      - name: Minify generated HTML
        run: bin/minify-docs.sh ./docs

      # Si la minificación rompiera el <head>, las previsualizaciones al
      # compartir dejarían de funcionar sin que nadie se diera cuenta.
      - name: Verify metadata survived minification
        run: |
          python3 - <<'EOF'
          import glob, sys
          from html.parser import HTMLParser

          class Meta(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = {}
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  clave = d.get('property') or d.get('name')
                  if tag == 'meta' and clave:
                      self.tags[clave] = d.get('content')

          requeridas = ['og:title', 'og:description', 'og:image', 'og:url', 'twitter:card']
          fallos = []

          for ruta in ['docs/index.html'] + sorted(glob.glob('docs/*/*/index.html'))[:40]:
              p = Meta()
              p.feed(open(ruta, encoding='utf-8').read())
              faltan = [t for t in requeridas if not p.tags.get(t)]
              if faltan:
                  fallos.append(f'{ruta}: faltan {", ".join(faltan)}')

          if fallos:
              print('\n'.join(fallos))
              sys.exit(1)

          print('Meta etiquetas Open Graph verificadas.')
          EOF

      - name: Commit y push de docs
        #        if: ${{ steps.sipri.outcome == 'success' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Actualizar página pública
          file_pattern: 'docs/**'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sipri-analyzer-files
          path: |
            pdfs/
            var/data_prod.db
