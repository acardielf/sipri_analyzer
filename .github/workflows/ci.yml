name: CI

on:
  push:
    branches:
      - main
    # El propio workflow hace commit de docs/. Si ese commit se empuja con un PAT
    # (secrets.PAT), GitHub sí dispara workflows de nuevo: sin esta exclusión se
    # entraría en bucle.
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: "0 16 * 1-6,9-12 *" # todos los días de septiembre a junio (excluye julio y agosto) a las 16:00 UTC
  workflow_dispatch: ~ # manual trigger
  workflow_call:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  get-last-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Download artifact from full-manual.yml
        uses: actions/github-script@v7.0.1
        continue-on-error: true
        with:
          script: |
            try {
              const workflowFileName = "full-manual.yml";
              const artifactName = "sipri-analyzer-files";

              async function downloadArtifact(workflowFileName) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowFileName,
                  status: "success",
                  per_page: 1
                });

                if (runs.data.workflow_runs.length === 0) {
                  core.warning(`⚠️ No se encontró ejecución previa para ${workflowFileName}`);
                  return false;
                }

                const run_id = runs.data.workflow_runs[0].id;

                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });

                const artifact = artifacts.data.artifacts.find(a => a.name === artifactName);
                if (!artifact) {
                  core.warning(`⚠️ No se encontró el artefacto ${artifactName} en ${workflowFileName}`);
                  return false;
                }

                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: "zip"
                });

                const fs = require("fs");
                fs.writeFileSync(`${artifactName}-${workflowFileName}.zip`, Buffer.from(download.data));
                return true;
              }

              await downloadArtifact("full-manual.yml");
            } catch (e) {
              core.warning(`⚠️ Error al descargar artefacto full-manual.yml: ${e.message}`);
            }

      - name: Unzip full-manual artifact if exists
        continue-on-error: true
        run: |
          if [ -f sipri-analyzer-files-full-manual.yml.zip ]; then
            unzip -o sipri-analyzer-files-full-manual.yml.zip -d .
          fi

      - name: Download artifact from ci.yml
        uses: actions/github-script@v7.0.1
        continue-on-error: true
        with:
          script: |
            try {
              const workflowFileName = "ci.yml";
              const artifactName = "sipri-analyzer-files";
              const fs = require("fs");

              async function downloadArtifact(workflowFileName) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowFileName,
                  status: "success",
                  per_page: 1
                });

                if (runs.data.workflow_runs.length === 0) {
                  core.warning(`⚠️ No se encontró ejecución previa para ${workflowFileName}`);
                  return false;
                }

                const run_id = runs.data.workflow_runs[0].id;

                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });

                const artifact = artifacts.data.artifacts.find(a => a.name === artifactName);
                if (!artifact) {
                  core.warning(`⚠️ No se encontró el artefacto ${artifactName} en ${workflowFileName}`);
                  return false;
                }

                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: "zip"
                });

                fs.writeFileSync(`${artifactName}-${workflowFileName}.zip`, Buffer.from(download.data));
                return true;
              }

              await downloadArtifact("ci.yml");
            } catch (e) {
              core.warning(`⚠️ Error al descargar artefacto ci.yml: ${e.message}`);
            }


      - name: Unzip ci artifact if exists (overwrites duplicates)
        continue-on-error: true
        run: |
          if [ -f sipri-analyzer-files-ci.yml.zip ]; then
            unzip -o sipri-analyzer-files-ci.yml.zip -d .
          fi

      - name: Install PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          # gd genera las imágenes de previsualización (sipri:og-images)
          php-version: '8.5'
          extensions: mbstring, intl, pdo, pdo_sqlite, xml, curl, zip, gd
          tools: composer:v2
          coverage: none

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: ./vendor/
          key: sipri_cache

      - name: Make envfile
        run: |
          cat > .env << 'EOF'
          APP_ENV=prod
          DATABASE_URL=sqlite:///%kernel.project_dir%/var/data_%kernel.environment%.db
          EOF

      - name: Cache Vendor dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-vendor-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tabula-py[jpype] pandas

      - name: Install Java (for tabula-py)
        run: sudo apt-get update && sudo apt-get install -y default-jre

      - name: Prepare Symfony dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php bin/console cache:clear


      - name: Prepare Symfony DB
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Check existing records
        run: |
          php bin/console dbal:run-sql "SELECT max(cast(id as integer)) FROM convocatoria"

      - name: Run SIPRI Analyzer only last
        run: php bin/console sipri:last --back 2 || true

      - name: Generate static website
        #        if: ${{ success() && steps.sipri.outcome == 'success' }}
        run: |
          php bin/console sipri:og-images
          php bin/console asset-map:compile
          php bin/console -e prod cache:clear
          php bin/console -e prod stenope:build --host=acardielf.github.io --base-url=/sipri_analyzer --scheme=https --no-sitemap ./docs
          rm public/assets/ -rf

      # minify-html (Rust): procesa los ~1,6 GB de HTML en segundos, donde un
      # minificador en JS tardaría minutos. Reduce el peso a algo menos de la
      # mitad, lo que además frena el crecimiento del historial del repositorio.
      - name: Install minify-html
        env:
          MINHTML_VERSION: '0.18.1'
        run: |
          curl -fsSL -o /usr/local/bin/minhtml \
            "https://github.com/wilsonzlin/minify-html/releases/download/v${MINHTML_VERSION}/minhtml-${MINHTML_VERSION}-x86_64-unknown-linux-gnu"
          sudo chmod +x /usr/local/bin/minhtml
          minhtml --version

      - name: Minify generated HTML
        run: |
          antes=$(du -sm docs | cut -f1)

          # --keep-closing-tags y --keep-html-and-head-opening-tags mantienen el
          # marcado explícito: los rastreadores de Telegram, WhatsApp y Facebook
          # leen las meta etiquetas de <head> y conviene no darles sorpresas.
          find docs -name '*.html' -print0 \
            | xargs -0 -n 200 -P "$(nproc)" minhtml --keep-closing-tags --keep-html-and-head-opening-tags

          despues=$(du -sm docs | cut -f1)
          echo "docs/: ${antes} MB → ${despues} MB"
          echo "### HTML minificado: ${antes} MB → ${despues} MB" >> "$GITHUB_STEP_SUMMARY"

      # Si la minificación rompiera el <head>, las previsualizaciones al
      # compartir dejarían de funcionar sin que nadie se diera cuenta.
      - name: Verify metadata survived minification
        run: |
          python3 - <<'EOF'
          import glob, sys
          from html.parser import HTMLParser

          class Meta(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = {}
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  clave = d.get('property') or d.get('name')
                  if tag == 'meta' and clave:
                      self.tags[clave] = d.get('content')

          requeridas = ['og:title', 'og:description', 'og:image', 'og:url', 'twitter:card']
          fallos = []

          for ruta in ['docs/index.html'] + sorted(glob.glob('docs/*/*/index.html'))[:40]:
              p = Meta()
              p.feed(open(ruta, encoding='utf-8').read())
              faltan = [t for t in requeridas if not p.tags.get(t)]
              if faltan:
                  fallos.append(f'{ruta}: faltan {", ".join(faltan)}')

          if fallos:
              print('\n'.join(fallos))
              sys.exit(1)

          print('Meta etiquetas Open Graph verificadas.')
          EOF

      - name: Commit y push de docs
        #        if: ${{ steps.sipri.outcome == 'success' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Actualizar página pública
          file_pattern: 'docs/**'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sipri-analyzer-files
          path: |
            pdfs/
            var/data_prod.db
